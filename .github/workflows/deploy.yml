name: Build & Deploy Site

# 触发条件：
#   1. push 到 main —— 每周自动化提交新文章后自动触发
#   2. 手动触发 —— Actions 页面点 "Run workflow"
#   3. 每天定时重建 —— 兜底，防止配置改动漏掉
on:
  push:
    branches: [main]
    paths:
      - "site-src/**"
      - ".affiliate-links.json"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # 每天 UTC 03:00（北京时间 11:00）

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，不取消进行中的（避免线上目录被清空）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::site/index.html 没有生成，构建失败"
            exit 1
          fi
          echo "生成文件数：$(find site -type f | wc -l)"
          echo "文章数：$(find site/posts -name index.html 2>/dev/null | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
